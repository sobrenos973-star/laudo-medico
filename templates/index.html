<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Laudo Bioquímico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="mb-4">Gerador de Laudo</h3>

            <form method="POST" action="/gerar">
                <div class="mb-3">
                    <label class="form-label">Nome do Paciente</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Glicose (mg/dL)</label>
                    <input type="number" name="glicose" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Colesterol Total (mg/dL)</label>
                    <input type="number" name="colesterol" class="form-control" required>
                </div>

                <button class="btn btn-primary w-100">
                    Gerar PDF
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
